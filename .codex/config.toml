#:schema https://developers.openai.com/codex/config-schema.json

developer_instructions = "Leia AGENTS.md integralmente antes de editar. Classifique risco (baixo/moderado/alto/crítico), dependências e escopo. Para tarefa trivial execute diretamente sem subagentes. Delegue somente investigações independentes ou especialidades necessárias, no máximo dois subagentes ativos por sessão; não permita edição paralela dos mesmos arquivos. Use agentes definidos aqui pelos seus nomes e responsabilidades, priorizando segurança e isolamento multiclínica. Esforço do agente principal não muda automaticamente durante a sessão: não afirme que mudou. Para trabalhos de alto risco, prefira subagente security ou architect com high; para trabalho simples evite delegação. Não faça deploy, merge, commit não solicitado pelo executor nem modifique regras fora do escopo. Na resposta final detalhe classificação, agentes acionados, testes reais, riscos e limitações."

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[agents.frontend]
description = "React 19, TypeScript, Vite, TanStack Query, componentes e UX responsiva"
config_file = "agents/frontend.toml"

[agents.security]
description = "Revisão de sessão, autorização visual, clínica selecionada e vazamento de estado"
config_file = "agents/security.toml"

[agents.qa]
description = "Vitest, Testing Library, Playwright e axe-core"
config_file = "agents/qa.toml"

[agents.architect]
description = "Arquitetura React, roteamento, estado e integração com API"
config_file = "agents/architect.toml"
