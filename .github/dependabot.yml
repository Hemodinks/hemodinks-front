# Atualiza as GitHub Actions pinadas por SHA (#222). PRs vão para developer, agrupados por semana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
  # npm só para security updates (#261): limite 0 desliga os PRs de versão, mas os de CVE
  # continuam. O GitHub abre security updates contra a branch padrão (ignora target-branch).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix(deps)
