name: Deploy Azure Static Web Apps

"on":
  workflow_call:
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410:
        required: true
      VITE_API_URL:
        required: true
      VITE_SENTRY_DSN:
        required: false

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

jobs:
  build_and_deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Deploy production
    runs-on: ubuntu-latest
    concurrency:
      group: azure-static-web-apps-production
      cancel-in-progress: false
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SENTRY_DSN: ''
      VITE_SENTRY_TRACES_SAMPLE_RATE: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check deployment inputs
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        shell: bash
        run: |
          missing=()
          [ -n "$VITE_API_URL" ] || missing+=("VITE_API_URL")

          [ -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" ] || missing+=("AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::npm ci failed on attempt ${attempt}. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Run unit tests
        env:
          VITE_API_URL: http://localhost:5000
        run: npm test

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
        run: npm run build

      - name: Check bundle budget
        run: npm run budget

      - name: Verify release revision is still current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/assert-release-revision.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          skip_app_build: true
