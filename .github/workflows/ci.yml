name: CI

"on":
  push:
    branches:
      - main
      - developer
      - dev-local
  pull_request:
    branches:
      - main
      - developer
      - dev-local
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SENTRY_DSN: ''
      VITE_SENTRY_TRACES_SAMPLE_RATE: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::npm ci failed on attempt ${attempt}. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Test production release gate
        run: npm run test:release-gate

      - name: Install Playwright browsers
        id: playwright-browsers
        run: npx playwright install --with-deps chromium

      - name: Audit frontend architecture
        run: npm run audit:architecture

      - name: Run unit tests
        run: npm test

      - name: Test performance budgets and audit fixtures
        run: npm run test:performance

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run budget

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run responsive and tenant smoke matrix
        if: ${{ !cancelled() && steps.playwright-browsers.outcome == 'success' }}
        run: npm run test:e2e:responsive

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hemodinks-front-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload responsive Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-responsive
          path: |
            playwright-report/responsive
            playwright-report/responsive-results.json
            test-results/responsive
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Azure Static Web Apps
    needs: test-and-build
    if: ${{ needs.test-and-build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/azure-static-web-apps-production.yml
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
