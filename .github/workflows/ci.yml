name: CI

"on":
  push:
    branches:
      - main
      - developer
      - dev-local
  pull_request:
    branches:
      - main
      - developer
      - dev-local
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Decide test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test scope rules
        run: python3 -B -m unittest discover -s scripts/tests -p test_ci_scope.py -v

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
          CI_WORKFLOW: ci.yml
          CI_REQUIRED_JOBS: "Unit tests and build,E2E (,Responsive smoke matrix"
        run: python3 -B scripts/ci_scope.py

  unit:
    name: Unit tests and build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::npm ci failed on attempt ${attempt}. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Test production release gate
        run: npm run test:release-gate

      - name: Audit frontend architecture
        run: npm run audit:architecture

      - name: Run unit tests
        run: npm test

      - name: Test performance budgets and audit fixtures
        run: npm run test:performance

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run budget

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hemodinks-front-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::npm ci failed on attempt ${attempt}. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  responsive:
    name: Responsive smoke matrix
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: ci
      VITE_APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after ${attempt} attempts."
              exit 1
            fi

            echo "::warning::npm ci failed on attempt ${attempt}. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run responsive and tenant smoke matrix
        run: npm run test:e2e:responsive

      - name: Upload responsive Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-responsive
          path: |
            playwright-report/responsive
            playwright-report/responsive-results.json
            test-results/responsive
          if-no-files-found: ignore
          retention-days: 7

  # Required check on main. Passes only when every test job passed, or when the scope
  # proved this exact tree already passed them (see scripts/ci_scope.py). Fails closed.
  test-and-build:
    name: Test and build
    needs: [scope, unit, e2e, responsive]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Require test jobs or proven reuse
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_TESTS: ${{ needs.scope.outputs.run_tests }}
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RESPONSIVE_RESULT: ${{ needs.responsive.result }}
        run: node scripts/ci-gate.mjs

  deploy:
    name: Deploy Azure Static Web Apps
    needs: test-and-build
    if: ${{ needs.test-and-build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/azure-static-web-apps-production.yml
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
