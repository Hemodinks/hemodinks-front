name: Deploy Azure Static Web Apps

'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_APP_ENV: production
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      VITE_NEW_RELIC_ACCOUNT_ID: ${{ vars.VITE_NEW_RELIC_ACCOUNT_ID }}
      VITE_NEW_RELIC_AGENT_ID: ${{ vars.VITE_NEW_RELIC_AGENT_ID }}
      VITE_NEW_RELIC_APPLICATION_ID: ${{ vars.VITE_NEW_RELIC_APPLICATION_ID }}
      VITE_NEW_RELIC_LICENSE_KEY: ${{ secrets.VITE_NEW_RELIC_LICENSE_KEY }}
      VITE_NEW_RELIC_TRUST_KEY: ${{ vars.VITE_NEW_RELIC_TRUST_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check deployment inputs
        shell: bash
        run: |
          missing=()
          [ -n "$VITE_API_URL" ] || missing+=("VITE_API_URL")

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            [ -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" ] || missing+=("AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410")
          fi

          new_relic_configured=false
          for variable_name in \
            VITE_NEW_RELIC_ACCOUNT_ID \
            VITE_NEW_RELIC_AGENT_ID \
            VITE_NEW_RELIC_APPLICATION_ID \
            VITE_NEW_RELIC_LICENSE_KEY \
            VITE_NEW_RELIC_TRUST_KEY; do
            if [ -n "${!variable_name}" ]; then
              new_relic_configured=true
              break
            fi
          done

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$new_relic_configured" = true ]; then
            [ -n "$VITE_NEW_RELIC_ACCOUNT_ID" ] || missing+=("VITE_NEW_RELIC_ACCOUNT_ID")
            [ -n "$VITE_NEW_RELIC_AGENT_ID" ] || missing+=("VITE_NEW_RELIC_AGENT_ID")
            [ -n "$VITE_NEW_RELIC_APPLICATION_ID" ] || missing+=("VITE_NEW_RELIC_APPLICATION_ID")
            [ -n "$VITE_NEW_RELIC_LICENSE_KEY" ] || missing+=("VITE_NEW_RELIC_LICENSE_KEY")
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::notice::New Relic Browser monitoring is disabled because no VITE_NEW_RELIC_* configuration was provided."
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deployment configuration values: ${missing[*]}"
            exit 1
          fi

      - name: Run complete frontend quality gate
        uses: ./.github/actions/frontend-quality

      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Close pull request preview
    runs-on: ubuntu-latest
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_0D59A4410 }}

    steps:
      - name: Close pull request preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
