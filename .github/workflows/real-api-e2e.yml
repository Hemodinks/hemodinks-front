name: Web + real API E2E

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-api-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide real API test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same rules as ci.yml: skip a merge push whose exact tree already passed this job in its PR.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
          CI_WORKFLOW: real-api-e2e.yml
          CI_REQUIRED_JOBS: "Web + API + synthetic SQL"
        run: python3 -B scripts/ci_scope.py

  synthetic-integration:
    name: Web + API + synthetic SQL
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_tests != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEMODINKS_API_ROOT: ${{ github.workspace }}/.integration/api
      VITE_APP_ENV: synthetic-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout reviewed API revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hemodinks/hemodinks-api
          ref: fa3ef7cddf233807c83379fa804a286e0a6513d9
          path: .integration/api
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e:real:policy
      - name: Exercise Web + real API + disposable SQL (no production credentials)
        run: npm run test:e2e:real
      - name: Upload minimized integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-api-e2e-summary
          path: test-results/real-api/summary.json
          if-no-files-found: error
          retention-days: 7
