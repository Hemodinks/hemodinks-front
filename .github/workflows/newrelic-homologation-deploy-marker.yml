name: New Relic homologation deploy marker

# Marcador "Deployments" no app Browser "Hemodinks Front HOMOL" a cada deploy da homologacao.
# A homologacao e publicada pela integracao Git da Vercel (nao por workflow deste repositorio);
# a Vercel registra cada deploy da developer como deployment "Production" no GitHub, e e
# esse evento que dispara este workflow. Previews de PR ("Preview") nao marcam nada.
# Nunca afeta o deploy: roda depois dele e o passo tem continue-on-error.
on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: newrelic-homologation-marker-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production'
      && github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the deployed commit is on developer
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...developer" --jq '.status' || echo error)
          if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
            echo "on_developer=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Commit $SHA nao esta na developer ($status); marcador nao registrado."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.on_developer == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.branch.outputs.on_developer == 'true'
        with:
          node-version: 22
      - name: Record deployment in New Relic
        if: steps.branch.outputs.on_developer == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
          # IDs publicos do app Browser "Hemodinks Front HOMOL" (os mesmos que vao no bundle da homologacao).
          VITE_NEW_RELIC_ACCOUNT_ID: '8221159'
          VITE_NEW_RELIC_APPLICATION_ID: '601695837'
          DEPLOY_ENVIRONMENT: homologation
          VERCEL_DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: node scripts/newrelic-change-tracking.mjs
