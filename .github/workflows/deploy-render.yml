name: Deploy Render

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

concurrency:
  group: render-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    environment:
      name: render-production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_APP_ENV: production
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run complete frontend quality gate
        uses: ./.github/actions/frontend-quality

      - name: Trigger Render deploy
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Skipping Render deploy. Missing secret: RENDER_DEPLOY_HOOK_URL"
            exit 0
          fi

          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
