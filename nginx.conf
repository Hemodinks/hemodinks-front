server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/hemodinks-security-headers.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/hemodinks-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ^~ /assets/ {
    expires 1y;
    include /etc/nginx/snippets/hemodinks-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
    expires 1d;
    include /etc/nginx/snippets/hemodinks-security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /otel-runtime-config.json {
    include /etc/nginx/snippets/hemodinks-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
