services:
  - type: web
    name: hemodinks-front
    runtime: static
    repo: https://github.com/Hemodinks/hemodinks-front
    branch: main
    buildCommand: npm ci && npm run build && npm run budget
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_ENV
        value: production
      - key: VITE_APP_VERSION
        sync: false
      - key: VITE_CLINICA_ID
        sync: false
      - key: VITE_CLINICA_SLUG
        sync: false
      - key: VITE_NEW_RELIC_ACCOUNT_ID
        sync: false
      - key: VITE_NEW_RELIC_AGENT_ID
        sync: false
      - key: VITE_NEW_RELIC_APPLICATION_ID
        sync: false
      - key: VITE_NEW_RELIC_LICENSE_KEY
        sync: false
      - key: VITE_NEW_RELIC_TRUST_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://hemodinks-api-prod.politepond-d3524c51.brazilsouth.azurecontainerapps.io https://hemodinks-api-1-90nb.onrender.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.nr-data.net https://*.grafana.net https://*.applicationinsights.azure.com https://*.monitor.azure.com http://localhost:* ws://localhost:* wss://localhost:*; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /otel-runtime-config.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
